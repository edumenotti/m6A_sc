h5_input: "../data/count/filtered_feature_bc_matrix.h5"
hspc_ref_h5ad: "../data/references/nestorowa_2016_hspc.h5ad"
hspc_ref_labels_key: "cell_type"
hspc_ref_batch_key: "reference_batch"
mature_ref_h5ad: "../data/references/kucinski_2024_bone_marrow.h5ad"
mature_ref_labels_key: "cell_type"
mature_ref_batch_key: "reference_batch"
outdir: "../results"
mito_nmads: 4.0
count_nmads: 6.0
expected_doublet_rate: 0.075
doubletfinder_pcs: 20
doubletfinder_pk: 0.09
doubletfinder_auto_pk: false
doubletfinder_install_missing: true
n_hvgs: 3000
n_latent: 30
max_epochs: 400
# GPU sizing for scVI INTEGRATE. Moderate on purpose so it schedules fast on a
# shared GPU partition (scVI on ~42k cells is light). Raise if your cluster is OK.
gpu_mem: "16 GB"
gpu_cpus: 4
gpu_time: "02:00:00"
leiden_resolution: 0.5
popv_methods: "KNN_BBKNN,KNN_SCVI,SCANVI_POPV,Support_Vector,XGboost"
popv_mode: "retrain"
popv_hvg: 4000
popv_samples_per_label: 300
reconcile_hspc_label_regex: "(?i)(^|[^A-Za-z])(LT-?HSC|ST-?HSC|HSC|MPP|LMPP|CMP|GMP|MEP|HSPC|progenitor|prog|stem)([^A-Za-z]|$)"
reconcile_min_confidence: 0.55
reconcile_cluster_majority_min_fraction: 0.70
progenitor_annotation_map: "config/progenitor_annotation_map.tsv"
run_progenitor_recluster: true
run_label_transfer: false
# Canonical manual annotation backbone: leiden_r1.0 + the coarse→fine full map
# (carries manual_level1 AND manual_level2). The downstream subset-recluster
# (script 12) is hardcoded to leiden_r1.0 clusters 15/13 and refines manual_level2,
# so this must stay r1.0. (The level1-only r2.0 map was an abandoned exploration.)
leiden_resolution_manual: 1.0
annotation_version: "manual_full_r1.0_2026-05-05"
manual_annotation_map: "config/manual_annotation_full_map_leiden_r1.0.tsv"

# ── Downstream analysis (scripts 15, 21a/b/c, 21z, 22, 18, 19, 20) ──
# Runs the canonical-annotation chain (HemaScribe → finalize → cleanup, producing
# adata_hemascribe.h5ad with `cell_type`) then MACROPHAGE_STATES, COMPOSITION_SCCODA,
# PSEUDOBULK_DEG, PATHWAY_ACTIVITY on that object. CellChat/NicheNet outputs were
# archived 2026-05-12 (composition confound + n=2 → exploratory only).
run_downstream_analysis: true
pseudobulk_min_cells: 10
pathway_organism: "mouse"
# Cell-type level(s) for composition/DEG (comma-separated). Default: canonical cell_type.
downstream_levels: "cell_type"
cellchat_organism: "Mm"  # kept for backward compat if 16/17 are re-run manually
nichenet_organism: "mouse"
