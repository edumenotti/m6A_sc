[workspace]
channels = ["conda-forge", "bioconda"]
name = "charles-scrna"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

# ── Pipeline principal (integração + QC + clustering) ──
[dependencies]
python = ">=3.11,<3.12"
scanpy = ">=1.9,<1.10"
anndata = ">=0.10,<0.11"
pandas = ">=1.5,<2"
matplotlib = ">=3.7,<4"
seaborn = ">=0.12,<1"
scikit-learn = ">=1.2,<2"
leidenalg = "*"
igraph = "*"
numpy = ">=1.23,<2"
hdf5 = "*"
cxx-compiler = "*"
r-base = ">=4.5,<4.6"
r-seurat = "*"
r-seuratobject = "*"
r-matrix = "*"
r-remotes = "*"
r-argparse = "*"
# CellChat / NicheNet runtime deps that compile from source via remotes::install_github
# (we provide them precompiled via conda to avoid system-lib compile failures)
r-ggpubr = "*"
r-nloptr = "*"
r-systemfonts = "*"
r-svglite = "*"
r-circlize = "*"
bioconductor-complexheatmap = "*"
r-tidyverse = "*"
r-randomforest = "*"
r-caret = "*"
r-hmisc = "*"
r-rfast = "*"
bioconductor-biocneighbors = "*"
r-gdtools = "*"
r-ggiraph = "*"
r-shadowtext = "*"
rpy2 = "*"
bioconductor-scrnaseq = "*"
bioconductor-zellkonverter = "*"
bioconductor-singlecellexperiment = "*"
bioconductor-summarizedexperiment = "*"
conda = "26.3.1.*"
"bioconductor-org.mm.eg.db" = ">=3.22.0,<4"

[pypi-dependencies]
torch = { version = ">=2.0", index = "https://download.pytorch.org/whl/cu128" }
scvi-tools = ">=1.1,<1.3"
celltypist = ">=1.6,<2"
pydeseq2 = ">=0.4"
gseapy = ">=0.14"
decoupler = ">=1.6"
scikit-misc = ">=0.5,<0.6"

# ── Feature popV (requer pandas<2, já satisfeito aqui) ──
[feature.popv.pypi-dependencies]
popv = ">=0.3"
obonet = ">=1.0"
gdown = ">=4.6"

[feature.popv.tasks]
annotate = "python pipeline/scripts/06_annotate.py"

[tasks]
qc-scan   = "python pipeline/scripts/00_qc_parameter_scan.py"
qc        = "python pipeline/scripts/01_qc.py"
doublets  = "python pipeline/scripts/02_doublets.py"
hvg-scan  = "python pipeline/scripts/03_hvg_parameter_scan.py"
normalize = "python pipeline/scripts/03_normalize.py"
integrate = "python pipeline/scripts/04_integrate.py"
cluster   = "python pipeline/scripts/05_cluster.py"
annotate  = "python pipeline/scripts/06_annotate.py"
markers   = "python pipeline/scripts/07_markers.py"

# ── Ambientes ──
[environments]
default = { solve-group = "default" }
popv    = { features = ["popv"], solve-group = "default" }
