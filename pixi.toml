[workspace]
channels = ["conda-forge"]
name = "charles-scrna"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

# ── Pipeline principal (integração + QC + clustering) ──
[dependencies]
python = ">=3.11,<3.12"
scanpy = ">=1.9,<1.10"
anndata = ">=0.10,<0.11"
pandas = ">=1.5,<2"
matplotlib = ">=3.7,<4"
seaborn = ">=0.12,<1"
scikit-learn = ">=1.2,<2"
leidenalg = "*"
igraph = "*"
numpy = ">=1.23,<2"
hdf5 = "*"
cxx-compiler = "*"

[pypi-dependencies]
torch = { version = ">=2.0", index = "https://download.pytorch.org/whl/cu128" }
scvi-tools = ">=1.1,<1.3"
celltypist = ">=1.6,<2"
scrublet = ">=0.2.3"
pydeseq2 = ">=0.4"
gseapy = ">=0.14"
decoupler = ">=1.6"

# ── Feature popV (requer pandas<2, já satisfeito aqui) ──
[feature.popv.pypi-dependencies]
popv = ">=0.3"
obonet = ">=1.0"
gdown = ">=4.6"

[feature.popv.tasks]
annotate = "python pipeline/scripts/06_annotate.py"

[tasks]
qc        = "python pipeline/scripts/01_qc.py"
doublets  = "python pipeline/scripts/02_doublets.py"
normalize = "python pipeline/scripts/03_normalize.py"
integrate = "python pipeline/scripts/04_integrate.py"
cluster   = "python pipeline/scripts/05_cluster.py"
annotate  = "python pipeline/scripts/06_annotate.py"
markers   = "python pipeline/scripts/07_markers.py"

# ── Ambientes ──
[environments]
default = { solve-group = "default" }
popv    = { features = ["popv"], solve-group = "default" }
